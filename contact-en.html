    <!-- Main Content -->
    <main>
        <section style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
            <h1 style="font-size: 2.5rem; color: #00D4FF; margin-bottom: 0.5rem;">Let's talk about your data project</h1>
            <p style="color: #cfe9f2; margin-bottom: 2rem;">I reply within 2 business days. Prefer another channel? Reach me directly by <a href="mailto:lukasrozado@proton.me" style="color:#00D4FF;">email</a> or <a href="https://www.linkedin.com/in/lukasrozado/" target="_blank" rel="noopener noreferrer" style="color:#00D4FF;">LinkedIn</a>.</p>

            <form action="https://formspree.io/f/mzzejlek" method="POST" style="display: grid; gap: 1.5rem;">
                <div style="display: grid; gap: 0.5rem;">
                    <label for="name" style="font-size: 1.1rem; color: #00D4FF;">Name:</label>
                    <input type="text" id="name" name="name" required
                           style="padding: 0.8rem; font-size: 16px; border: 2px solid #00D4FF; border-radius: 5px; background: #002D40; color: white;">
                </div>

                <div style="display: grid; gap: 0.5rem;">
                    <label for="email" style="font-size: 1.1rem; color: #00D4FF;">Email:</label>
                    <input type="email" id="email" name="email" required
                           style="padding: 0.8rem; font-size: 16px; border: 2px solid #00D4FF; border-radius: 5px; background: #002D40; color: white;">
                </div>

                <div style="display: grid; gap: 0.5rem;">
                    <label for="message" style="font-size: 1.1rem; color: #00D4FF;">Message:</label>
                    <textarea id="message" name="message" rows="6" required
                              style="padding: 0.8rem; font-size: 16px; border: 2px solid #00D4FF; border-radius: 5px; background: #002D40; color: white; resize: vertical;"></textarea>
                </div>

                <button type="submit"
                        style="padding: 1rem 2rem; background: #00D4FF; color: #0A0A23; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: opacity 0.3s;">
                    Send message. I reply within 2 business days
                </button>
            </form>
        </section>
    </main>

    <script>
        // Unregister the legacy service worker (portfolio-v3) and clear old caches
        if('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for(let registration of registrations) {
              registration.unregister();
            }
            caches.keys().then(names => {
              for(let name of names) caches.delete(name);
            });
          });
        }
        </script>
