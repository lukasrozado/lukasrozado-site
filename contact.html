    <main id="main-content" role="main" itemprop="mainContentOfPage">
        <section style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
            <h1 style="font-size: 2.5rem; color: #00D4FF; margin-bottom: 0.5rem;">Vamos conversar sobre seu projeto de dados</h1>
            <p style="color: #cfe9f2; margin-bottom: 2rem;">Respondo em até 2 dias úteis. Prefere outro canal? Fale direto por <a href="mailto:lukasrozado@proton.me" style="color:#00D4FF;">email</a> ou <a href="https://www.linkedin.com/in/lukasrozado/" target="_blank" rel="noopener noreferrer" style="color:#00D4FF;">LinkedIn</a>.</p>

            <form action="https://formspree.io/f/mzzejlek" method="POST" style="display: grid; gap: 1.5rem;">
                <div style="display: grid; gap: 0.5rem;">
                    <label for="nome" style="font-size: 1.1rem; color: #00D4FF;">Nome:</label>
                    <input type="text" id="nome" name="nome" required
                           style="padding: 0.8rem; font-size: 16px; border: 2px solid #00D4FF; border-radius: 5px; background: #002D40; color: white;">
                </div>

                <div style="display: grid; gap: 0.5rem;">
                    <label for="email" style="font-size: 1.1rem; color: #00D4FF;">Email:</label>
                    <input type="email" id="email" name="email" required
                           style="padding: 0.8rem; font-size: 16px; border: 2px solid #00D4FF; border-radius: 5px; background: #002D40; color: white;">
                </div>

                <div style="display: grid; gap: 0.5rem;">
                    <label for="mensagem" style="font-size: 1.1rem; color: #00D4FF;">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="6" required
                              style="padding: 0.8rem; font-size: 16px; border: 2px solid #00D4FF; border-radius: 5px; background: #002D40; color: white; resize: vertical;"></textarea>
                </div>

                <button type="submit"
                        style="padding: 1rem 2rem; background: #00D4FF; color: #0A0A23; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: opacity 0.3s;">
                    Enviar mensagem. Respondo em até 2 dias úteis
                </button>
            </form>
        </section>

    <script>
        // Desregistro o service worker legado (portfolio-v3) e limpa caches antigos
        if('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for(let registration of registrations) {
              registration.unregister();
            }
            caches.keys().then(names => {
              for(let name of names) caches.delete(name);
            });
          });
        }
        </script>
